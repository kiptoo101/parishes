            /* Base Styles - Optimized */

        <!-- Data Chunk Loading System - Optimized -->
        <script>
          // Configuration for chunk loading
          const totalChunks = 5;
          let loadedChunks = 0;
          let scriptLoadPromises = [];
          let churchDataReady = false;
          
          // Track loading progress with optimized DOM updates
          function updateLoadingProgress() {
              loadedChunks++;
              const percentage = Math.round((loadedChunks / totalChunks) * 100);
              
              // Update progress bar in a single operation using requestAnimationFrame
              requestAnimationFrame(() => {
                  document.getElementById('loading-progress-fill').style.width = percentage + '%';
                  document.getElementById('loading-status').textContent = 
                      `${loadedChunks} of ${totalChunks} chunks loaded (${percentage}%)`;
                  
                  // When all chunks are loaded, hide the loading indicator after a short delay
                  if (loadedChunks >= totalChunks) {
                      setTimeout(function() {
                          const loadingIndicator = document.getElementById('loading-indicator');
                          loadingIndicator.style.opacity = '0';
                          loadingIndicator.style.transition = 'opacity 0.3s ease';
                          setTimeout(() => {
                              loadingIndicator.style.display = 'none';
                          }, 300);
                      }, 500);
                  }
              });
          }
          
          // Create script loading helper with Promise for better control flow
          function loadScript(url) {
              return new Promise((resolve, reject) => {
                  const script = document.createElement('script');
                  script.type = 'text/javascript';
                  script.src = url;
                  
                  // When script is loaded, resolve the promise
                  script.onload = () => resolve(url);
                  
                  // If there's an error, reject the promise
                  script.onerror = () => {
                      console.error('Failed to load script:', url);
                      reject(new Error(`Failed to load ${url}`));
                  };
                  
                  // Add the script to the document to start loading
                  document.head.appendChild(script);
              });
          }
          
          // Optimized chunk loading - Load all chunks in parallel with Promise.all
          function loadDataChunks() {
              // Prepare promises for all chunks
              for (let i = 1; i <= totalChunks; i++) {
                  const scriptPromise = loadScript(`data/json_complete_parish_data_1_part${i}.js`)
                      .then(() => {
                          updateLoadingProgress();
                          return `Loaded part ${i}`;
                      })
                      .catch(error => {
                          console.error(`Failed to load part ${i}:`, error);
                          updateLoadingProgress(); // Still update progress even on error
                          return error; // Return error to not break Promise.all
                      });
                  
                  scriptLoadPromises.push(scriptPromise);
              }
              
              // When all chunks are loaded, load the loader script
              Promise.all(scriptLoadPromises)
                  .then(() => {
                      // Add a small delay before loading the final script to ensure all data is processed
                      setTimeout(() => {
                          loadScript('data/json_loader.js')
                              .then(() => {
                                  // The loader will call initializeMap() automatically
                                  churchDataReady = true;
                              })
                              .catch(error => {
                                  console.error('Failed to load json_loader.js:', error);
                                  // Try to recover by manually calling initializeMap if it exists
                                  if (typeof initializeMap === 'function') {
                                      initializeMap();
                                  }
                              });
                      }, 100);
                  })
                  .catch(error => {
                      console.error('Error during chunk loading:', error);
                  });
          }
          // Optimize initial loading with requestIdleCallback or setTimeout fallback
          if ('requestIdleCallback' in window) {
              requestIdleCallback(() => {
                  loadDataChunks();
              }, { timeout: 1000 }); // Ensure it runs within 1 second even if browser is busy
          } else {
              // Fallback for browsers without requestIdleCallback
              setTimeout(loadDataChunks, 100);
          }
          
          // Monitor for long loading times and provide fallback initialization
          setTimeout(() => {
              if (!churchDataReady && typeof initializeMap === 'function') {
                  console.warn('Data loading taking too long, attempting to initialize map anyway...');
                  try {
                      initializeMap();
                  } catch (e) {
                      console.error('Failed to initialize map:', e);
                  }
              }
          }, 15000); // 15-second timeout
      </script>

        // Debounce function for performance optimization
        function debounce(func, wait) {
            let timeout;
            return function() {
                const context = this;
                const args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), wait);
            };
        }
        
        // Throttle function for events that fire rapidly
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const context = this;
                const args = arguments;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }
        
        // Panel state tracking - using a more efficient data structure

        // Enhanced toggle panel function - Optimized

        // Helper to get panel ID from content ID - Optimized with caching
        const panelIdCache = {}; // Cache for repeated lookups
        function getPanelIdFromContentId(contentId) {
            // Return from cache if available
            if (panelIdCache[contentId]) return panelIdCache[contentId];
            
            const prefix = contentId.split('-')[0];

            if (prefix === 'filter' || prefix === 'church') {

            // Store in cache for future lookups

        // Close all panels except one that's being opened - Optimized
        function closeAllPanelsExcept(exceptContentId) {

          // Lazy load images - New optimization
          function setupLazyLoading() {
              // Check if Intersection Observer API is available
              if ('IntersectionObserver' in window) {
                  // Create options for the observer
                  const options = {
                      root: null,
                      rootMargin: '0px',
                      threshold: 0.1
                  };
                  
                  // Create the observer
                  const observer = new IntersectionObserver((entries, observer) => {
                      entries.forEach(entry => {
                          if (entry.isIntersecting) {
                              const img = entry.target;
                              if (img.dataset.src) {
                                  img.src = img.dataset.src;
                                  img.removeAttribute('data-src');
                              }
                              observer.unobserve(img);
                          }
                      });
                  }, options);
                  
                  // Observe all images with data-src attribute
                  document.querySelectorAll('img[data-src]').forEach(img => {
                      observer.observe(img);
                  });
                  
                  // Add a mutation observer to watch for new images
                  const mutationObserver = new MutationObserver(mutations => {
                      mutations.forEach(mutation => {
                          mutation.addedNodes.forEach(node => {
                              if (node.nodeType === 1 && node.tagName === 'IMG' && node.dataset.src) {
                                  observer.observe(node);
                              } else if (node.nodeType === 1) {
                                  // Check for images inside added nodes
                                  node.querySelectorAll('img[data-src]').forEach(img => {
                                      observer.observe(img);
                                  });
                              }
                          });
                      });
                  });
                  
                  // Start observing the document
                  mutationObserver.observe(document.body, {
                      childList: true,
                      subtree: true
                  });
              } else {
                  // Fallback for browsers without Intersection Observer
                  function lazyLoad() {
                      const lazyImages = document.querySelectorAll('img[data-src]');
                      const scrollTop = window.pageYOffset;
                      
                      lazyImages.forEach(img => {
                          if (img.offsetTop < window.innerHeight + scrollTop) {
                              img.src = img.dataset.src;
                              img.removeAttribute('data-src');
                          }
                      });
                      
                      if (lazyImages.length === 0) {
                          document.removeEventListener('scroll', lazyLoad);
                          window.removeEventListener('resize', lazyLoad);
                          window.removeEventListener('orientationchange', lazyLoad);
                      }
                  }
                  
                  // Add event listeners
                  document.addEventListener('scroll', throttle(lazyLoad, 200));
                  window.addEventListener('resize', throttle(lazyLoad, 200));
                  window.addEventListener('orientationchange', throttle(lazyLoad, 200));
                  
                  // Initial load
                  lazyLoad();
              }
          }
